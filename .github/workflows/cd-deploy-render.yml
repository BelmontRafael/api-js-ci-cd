name: CD Deploy Render

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
    secrets:
      DEPLOY_HOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  deploy_render:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}

    steps:
      - name: Check Render deploy hook
        id: deploy_hook
        shell: bash
        run: |
          if [ -n "${DEPLOY_HOOK_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy
        if: steps.deploy_hook.outputs.enabled == 'true'
        shell: bash
        run: curl --fail --show-error --silent -X POST "${DEPLOY_HOOK_URL}"

      - name: Deploy skipped
        if: steps.deploy_hook.outputs.enabled != 'true'
        run: echo "Render deploy skipped because DEPLOY_HOOK_URL is not configured for this environment."
