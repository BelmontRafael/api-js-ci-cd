name: CD Orchestrator

on:
  push:
    branches: ["main"]
    paths:
      - "api-js/**"
      - ".github/workflows/cd*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_homolog:
    name: Deploy Homolog (Render)
    uses: ./.github/workflows/cd-deploy-render.yml
    with:
      environment_name: homolog
    secrets:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_HOMOLOG_DEPLOY_HOOK }}

  dast_homolog:
    name: DAST (OWASP ZAP)
    needs: deploy_homolog
    uses: ./.github/workflows/cd-dast-zap.yml
    with:
      target_url: ${{ vars.RENDER_HOMOLOG_URL }}

  manual_approval:
    name: Aprovacao Manual
    needs: dast_homolog
    uses: ./.github/workflows/cd-manual-approval.yml
    with:
      environment_name: production
