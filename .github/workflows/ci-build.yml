name: Build

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./api-js

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "api-js/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
