name: Container Pipeline

on:
  push:
    branches: ["main", "ci-cd"]
    paths:
      - "api-js/**"
      - ".github/workflows/ci-container.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "api-js/**"
      - ".github/workflows/ci-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Docker Lint, Build, Trivy, Push
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image repository and tags
        id: image
        shell: bash
        run: |
          REPO="${{ vars.DOCKERHUB_REPOSITORY }}"
          if [ -z "$REPO" ]; then
            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            REPO="${OWNER}/api-js-ci-cd"
          fi

          SHA_TAG="${REPO}:${GITHUB_SHA}"
          LATEST_TAG="${REPO}:latest"

          {
            echo "repo=${REPO}"
            echo "sha_tag=${SHA_TAG}"
            echo "latest_tag=${LATEST_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        id: dockerhub_creds
        shell: bash
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dockerfile lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api-js/Dockerfile

      - name: Build Docker image
        run: |
          docker build \
            -f api-js/Dockerfile \
            -t "${{ steps.image.outputs.sha_tag }}" \
            api-js

      - name: Trivy scan image report (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ steps.image.outputs.sha_tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Trivy gate (CRITICAL only)
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ steps.image.outputs.sha_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Docker Hub login
        if: github.event_name != 'pull_request' && steps.dockerhub_creds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push image (SHA tag)
        if: github.event_name != 'pull_request' && steps.dockerhub_creds.outputs.enabled == 'true'
        run: docker push "${{ steps.image.outputs.sha_tag }}"

      - name: Push image (latest on main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.dockerhub_creds.outputs.enabled == 'true'
        run: |
          docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.latest_tag }}"
          docker push "${{ steps.image.outputs.latest_tag }}"

      - name: Push skipped
        if: github.event_name != 'pull_request' && steps.dockerhub_creds.outputs.enabled != 'true'
        run: echo "Docker Hub push skipped because DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN is not configured."