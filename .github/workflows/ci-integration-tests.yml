name: Integration Tests

on:
  workflow_call:
    inputs:
      db_name:
        required: true
        type: string
      db_user:
        required: true
        type: string
      db_host:
        required: true
        type: string
      db_dialect:
        required: true
        type: string
    secrets:
      DB_PASSWORD:
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ./api-js

jobs:
  integration_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ inputs.db_name }}
          POSTGRES_USER: ${{ inputs.db_user }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.db_user }} -d ${{ inputs.db_name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "api-js/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ inputs.db_host }}
          DB_DIALECT: ${{ inputs.db_dialect }}
        run: npm run test:integration
